name: e-wallet

services:
  db:
    image: postgres:14.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewallet
      POSTGRES_USER: ewallet_app
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    volumes:
      - ewallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewallet_app -d ewallet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ewallet_network

  backend:
    image: YOUR_DOCKERHUB_USERNAME/e-wallet-backend:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ewallet
      SPRING_DATASOURCE_USERNAME: ewallet_app
      SPRING_DATASOURCE_PASSWORD: CHANGE_ME_DB_PASSWORD
      JWT_SECRET: CHANGE_ME_TO_A_RANDOM_SECRET_AT_LEAST_64_CHARACTERS_LONG
      APP_SECURITY_CORS_ALLOWED_ORIGINS: http://YOUR_SERVER_PUBLIC_IP:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ewallet_network

  frontend:
    image: YOUR_DOCKERHUB_USERNAME/e-wallet-frontend:latest
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://YOUR_SERVER_PUBLIC_IP:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ewallet_network

volumes:
  ewallet_postgres_data:

networks:
  ewallet_network:
    driver: bridge